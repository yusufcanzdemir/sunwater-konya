# Single source of parameters for the pipeline (PLAN.md rule 3).
# Values marked "default – KKn" are provisional until the matching decision gate.

earth_engine:
  # Google Cloud project registered for non-commercial Earth Engine use.
  # The EE_PROJECT environment variable overrides this value.
  project: climathon-512416
  asset_folder: sunwater   # -> projects/<project>/assets/sunwater

paths:
  outputs: outputs # relative to pipeline/, git-ignored

seasons:
  main: 2025 # fixed at KK1 (D5)
  comparison: 2024 # fixed at KK1 (D5)
  start_mmdd: "03-01"
  end_mmdd: "10-31"

# Pilot area, [west, south, east, north] in WGS84. Fixed at KK1 (D4):
# irrigated plain north/north-west of Karapınar (~26 x 22 km, ~586 km², 54% cropland).
pilot_bbox: [33.30, 37.70, 33.60, 37.90]

aoi:
  # Level 5 is the coarsest level where the Konya Closed Basin (with Tuz Gölü and
  # Beyşehir sub-basins) is one endorheic polygon; level 6 splits it.
  basin_dataset: WWF/HydroSHEDS/v1/Basins/hybas_5
  basin_seed_point: [32.49, 37.87]   # Konya city centre
  worldcover_id: ESA/WorldCover/v200
  cropland_class: 40
  cropland_scale_pilot_m: 10
  cropland_scale_basin_m: 30
  # ASSUMPTION, only for the rough field-count estimate shown at KK1;
  # replaced by segmentation results in stage 3.
  mean_field_ha_assumption: [3, 10]
  preview_month: 7                   # month of the main season used for RGB previews

composites:
  cloud_score_band: cs_cdf
  clear_threshold: 0.6        # pixel kept if cs_cdf >= threshold
  # Periods are dekads (days 1-10, 11-20, 21-end of month) inside the season.
  index_scale: 10000          # indices stored as int16 = round(index * scale), clamped to [-1, 1]
  export_scale_m: 10
  export_crs: EPSG:32636      # UTM 36N
  segmentation_season: main
  segmentation_months: [4, 5, 6, 7, 8, 9]
  segmentation_rgb_month: 7
  gap_stats_scale_m: 20

segmentation:
  # Method A: SNIC on the monthly NDVI stack (composites.segmentation_months).
  # Each trial is exported and scored against the hand-drawn reference at KK2.
  trials:
    - {size: 20, compactness: 0.1}
    - {size: 30, compactness: 0.1}
    - {size: 45, compactness: 0.1}
  connectivity: 8
  neighborhood_factor: 2        # neighborhoodSize = factor * size
  min_area_ha: 0.5
  min_crop_fraction: 0.5        # share of WorldCover cropland pixels in the segment
  # Heuristic confidence = clamp(1 - dist / confidence_dist_max, 0, 1), where dist is the
  # segment's mean RMS distance of pixel NDVI profiles from the segment mean profile.
  confidence_dist_max: 0.3
  overlap_share: 0.5            # segment counts toward a reference field if >= this share lies inside
  selected_trial: sam_ndvi_false_color   # chosen at KK2 (PLAN.md D10)
  # Reference split for any tuned method: odd point numbers tune, even numbers test.
  # Points are in random order, so the split is random but reproducible.
  # Option 2 at KK2 (trial, not yet in PLAN.md): small SNIC superpixels merged when their
  # NDVI profiles are similar and no field boundary (edge) separates them.
  merge:
    base_trial: {size: 20, compactness: 0.1}
    profile_dist_grid: [0.03, 0.05, 0.07, 0.10, 0.14]
    edge_quantile_grid: [0.2, 0.35, 0.5, 0.65, 0.8]   # of initial border edge strengths
  # Method B: Segment Anything (Meta, ViT-H) on tiles of the 10 m pilot image (extra "sam").
  sam:
    checkpoint: outputs/models/sam_vit_h_4b8939.pth   # https://dl.fbaipublicfiles.com/segment_anything/
    model_type: vit_h
    tile_px: 512                # SAM upsamples each tile to 1024 internally (2x)
    overlap_px: 128
    inputs: [ndvi_false_color, rgb]                   # chosen on the tuning half
    generator:
      points_per_side: 32
      points_per_batch: 64
      pred_iou_thresh: 0.86
      stability_score_thresh: 0.92
      min_mask_region_area: 10

labels:
  # Stage 4 (KK3, PLAN.md D13). Keys are stored in labels.csv; names are shown in the UI.
  classes:
    sugar_beet: Şeker pancarı
    maize: Mısır
    sunflower: Ayçiçeği
    alfalfa: Yonca
    irrigated_winter_cereal: Sulu kışlık tahıl
    rainfed_winter_cereal: Kuru kışlık tahıl
    cereal_second_crop: Tahıl + ikinci ürün
    fallow: Nadas / boş
    other: Diğer
  min_per_class: 40
  target_total: [300, 500]
  season: main
  seed: 7
  rgb_months: [5, 6, 7, 9]          # monthly RGB previews shown next to each field
  chunk_size: 400                   # fields per reduceRegions request
  simplify_m: 5                     # geometry simplification for EE requests and the web map
  labels_file: 04_labels/labels.csv # relative to pipeline/, committed; written by /label
  order_file: 04_labels/label_order.json

features:
  # Stage 5: per-field features for crop classification, for both seasons.
  # 2024 uses the 2025 field polygons (no separate 2024 segmentation).
  inner_buffer_m: 10          # drop the outer pixel ring to avoid mixing with neighbours
  min_buffered_ha: 0.2        # smaller after buffering -> use the unbuffered polygon
  green_threshold: 0.4        # NDVI above this counts as "green" for season length
  harmonics: 2                # harmonic regression order (per index)
  sentinel1: true             # monthly VV/VH means (dB), optional per PLAN.md
  s1_months: [4, 5, 6, 7, 8, 9]
  chunk_size: 300

classify:
  # Stage 6 (PLAN.md D14): unsupervised clusters of field profiles, named by explicit rules.
  n_clusters: 20
  seed: 11
  uncertain_below: 0.7          # class probability below this -> flagged uncertain
  check_sample: 50              # random 2025 fields for the user's plausibility check
  check_file: 04_labels/checks.csv
  # Phenology rules applied to cluster mean NDVI/NDMI curves (lib/phenology.py).
  # RULES OF THUMB from the labelling guide, not calibrated against ground truth.
  rules:
    fallow_max_ndvi: 0.30         # never greener than this -> fallow
    alfalfa_april_ndvi: 0.45      # already green in April ...
    alfalfa_summer_ndvi: 0.50     # ... still green on average in June-September ...
    alfalfa_dip_prominence: 0.12  # ... and at least alfalfa_min_dips cutting dips
    alfalfa_min_dips: 2
    spring_green_may_ndvi: 0.35   # May mean above -> winter crop family
    cereal_drop: 0.25             # June-July minimum this far below the spring peak ...
    cereal_harvest_max_ndvi: 0.40 # ... and down to (near) bare soil
    second_crop_rise: 0.25        # Aug-Oct maximum this far above the June-July minimum ...
    second_crop_min_ndvi: 0.50    # ... and at least this green
    irrigated_cereal_peak: 0.70   # spring peak above -> irrigated
    irrigated_cereal_peak_with_ndmi: 0.60
    irrigated_cereal_ndmi: 0.30   # or peak above the previous value with Apr-Jun NDMI above this
    summer_min_peak: 0.45         # summer crops reach at least this
    beet_sep_ndvi: 0.65           # still green in September ...
    beet_oct_ndvi: 0.50           # ... and October -> sugar beet
    sunflower_drop: 0.30          # peak by July, end of August this far below the peak

weather:
  # Stage 7: daily reference ET (FAO-56) and precipitation per weather grid cell.
  open_meteo_url: https://archive-api.open-meteo.com/v1/archive
  timezone: Europe/Istanbul
  grid_step_deg: 0.1            # request lattice; Open-Meteo snaps each point to its grid cell
  # Mirrors DEFAULT_RAIN_RULE in src/engine/waterBalance.ts: Peff = P < threshold ? 0 : factor * P
  effective_rain: {threshold_mm: 5, factor: 0.8}
  era5_land_id: ECMWF/ERA5_LAND/DAILY_AGGR   # cross-check: FAO-56 Penman-Monteith from ERA5-Land
  era5_land_hourly_id: ECMWF/ERA5_LAND/HOURLY # hourly wind speed for that cross-check

et:
  # Stage 8: actual ET from scaled NDVI -> Kcb (main method, PLAN.md D3), no water stress.
  kcb_min: 0.15                 # bare soil basal coefficient
  ndvi_min: auto                # bare soil NDVI; auto = percentile of all field-dekad NDVI
  ndvi_max: auto                # full cover NDVI
  ndvi_min_percentile: 2
  ndvi_max_percentile: 99
  kcb_max:                      # mid-season Kcb, FAO-56 Table 17 (Allen et al. 1998)
    sugar_beet: 1.15
    maize: 1.15
    sunflower: 1.00             # Table 17 range 0.95-1.10
    alfalfa: 1.15               # hay, individual cutting periods
    irrigated_winter_cereal: 1.10
    rainfed_winter_cereal: 1.10
    cereal_second_crop: 1.15    # cereal 1.10 then e.g. maize 1.15; the higher value
    fallow: 1.00                # irrelevant at bare-soil NDVI
    other: 1.00
  smoothing: {window: 5, polyorder: 2}   # Savitzky-Golay over dekads before daily interpolation
  soil_evaporation:             # simplified FAO-56 dual coefficient (Ke)
    kc_max: 1.20                # upper limit of Kc after wetting (FAO-56 eq. 72, simplified)
    rain_wetting_mm: 5          # rain days that wet the surface
    decay_days: 3               # Kr = exp(-days since wetting / decay_days) (two-stage simplified)
    irrigation_interval_days: 7 # ASSUMPTION: irrigated fields wetted every N days while cropped
    crop_present_kcb: 0.30      # ... "cropped" = Kcb above this
  rainfed_classes: [rainfed_winter_cereal, fallow]   # blue ET = 0, ET capped by water supply
  crop_present_kcb: 0.30        # blue ET counts only days with Kcb above this (PLAN.md D16)
  initial_soil_water_mm: 100    # ASSUMPTION: plant-available soil water at season start
  sensitivity:                  # uncertainty range (low / high scenario)
    ndvi_delta: 0.05            # NDVI_min and NDVI_max shifted by +/- this
    kcb_max_delta: 0.10         # Kcb_max shifted by -/+ this
    # ET0 and precipitation: daily min / max of Open-Meteo and ERA5-Land (stage 7)

sebal:
  # Stage 9: SEBAL (own implementation, lib/sebal.py) on Landsat 8/9 C2 L2 overpasses.
  collections: [LANDSAT/LC08/C02/T1_L2, LANDSAT/LC09/C02/T1_L2]
  max_scene_cloud: 60           # CLOUD_COVER of the whole scene
  min_clear_fraction: 0.5       # clear share of the pilot area, else the overpass is skipped
  anchors:                      # automatic anchor pixels on WorldCover cropland
    cold_ndvi_pct: 95           # cold: NDVI >= this percentile ...
    cold_ts_pct: 20             # ... and LST <= this percentile among them
    hot_ndvi_pct: 10            # hot: NDVI <= this percentile ...
    hot_ts_pct: 80              # ... and LST >= this percentile among them
  ef_max: 1.05
  scale_m: 30
  min_field_pixels: 4           # valid 30 m pixels needed for a field value
  min_field_valid: 0.7          # and this share of the field's pixels
  # Water-stress flag relative to peers (KK5): SEBAL is ~40 % below NDVI-Kc on all irrigated
  # classes (energy-limited under advection), so an absolute SEBAL / NDVI-Kc ratio flags most fields.
  stress_min_peers: 10          # fields of the same class on the same overpass needed for a median
  stress_ratio: 0.75            # ASSUMPTION: median of SEBAL / class-day median below this ...
  stress_min_obs: 3             # ... over at least this many cropped overpasses -> flag
  modis_id: MODIS/061/MOD16A2GF # aggregate cross-check (ET band, 0.1 kg/m2 per 8 days)

budget:
  # Stage 11: field water budget. Defaults fixed at KK6 (PLAN.md D19); status shown against S1.
  reference_kcb: class_median   # class_median: day-by-day median Kcb of the class (confident fields);
                                # field: the field's own Kcb (then only soil evaporation differs)
  efficient_fw: 0.35            # wetted soil fraction under drip, FAO-56 Table 20 (trickle 0.3-0.4)
  s2_reduction: 0.20            # ASSUMPTION, fixed at KK6 (D19): S2 cuts pilot blue water by this share
  status_within: 1.00           # ratio = measured blue / budget; <= this: within budget
  status_limit: 1.15            # <= this: borderline; above: over budget
  irrigation_efficiency:        # application efficiency, same values as src/engine/waterBalance.ts
    flood: 0.55
    sprinkler: 0.72
    drip: 0.88
  default_method: sprinkler     # ASSUMPTION, fixed at KK6: method is not observed per field
  head_m: 120                   # ASSUMPTION, fixed at KK6: total pumping head; editable per field in the panel
  pump_efficiency: 0.50         # ASSUMPTION, fixed at KK6: pump-motor efficiency (prototype form default)
  deficit_et_reduction: 0.10    # deficit-irrigation lever: seasonal ET cut by this share
  ky:                           # seasonal yield response, continuous deficit; FAO yield response
    maize: 1.25                 # factors as tabulated in FAO/IAEA (Moutonnet), Table 1, from FAO-33
    sugar_beet: 0.85            # table gives 0.80 and 0.90; midpoint
    sunflower: 0.95
    irrigated_winter_cereal: 1.00   # "winter wheat"
    # alfalfa, cereal_second_crop, other: no verified value -> no yield estimate
  crop_switch:                  # crop-change lever: compare with the class median blue ET
    sugar_beet: irrigated_winter_cereal
    maize: sunflower
    alfalfa: irrigated_winter_cereal
    sunflower: irrigated_winter_cereal
    cereal_second_crop: irrigated_winter_cereal

export:
  # Stage 12: web data under outputs/12_export/data/
  min_zoom: 9                   # pilot area (~30 km) fills the screen around zoom 10-11
  max_zoom: 15                  # MapLibre overzooms beyond this
  simplify_m: 8                 # map tiles only: removes the 10 m pixel staircase of SAM edges
  player_step_days: 7           # whole-map season player resolution
  calendar_mid_share: 0.9       # mid-season = Kcb >= this share of the field's peak (Telegram crop calendar)
  publish_dir: ../public/data   # relative to pipeline/; served statically by Vite / Vercel (D20)
  publish_skip: ["*.parquet"]   # analysis copies only, the web app does not read them

basin:
  # Stage 10: basin water-storage context from GRACE / GRACE-FO (PLAN.md D8) minus GLDAS.
  grace_main: NASA/GRACE/MASS_GRIDS_V04/MASCON_CRI   # JPL RL06.3Mv04, CRI filtered (recommended)
  grace_alt: NASA/GRACE/MASS_GRIDS_V04/MASCON        # same, unfiltered: sensitivity
  grace_sh: NASA/GRACE/MASS_GRIDS_V04/LAND           # CSR / GFZ / JPL spherical harmonics, GRACE only
  grace_sh_to_cm: 100           # LAND bands come in metres (basin std 0.07 vs 7.3 cm mascon, r 0.95)
  grace_scale_m: 55660          # 0.5° grid (true mascon size ~3°)
  gldas_id: NASA/GLDAS/V021/NOAH/G025/T3H
  gldas_bands: [SoilMoi0_10cm_inst, SoilMoi10_40cm_inst, SoilMoi40_100cm_inst, SoilMoi100_200cm_inst,
                SWE_inst, CanopInt_inst]                 # kg/m² = mm
  gldas_scale_m: 27830
  start: "2003-01-01"           # PLAN.md: series from 2003
  baseline: ["2004-01-01", "2010-01-01"]   # common anomaly baseline (JPL mascon convention)
  grace_end: "2017-07-01"       # GRACE mission months before this, GRACE-FO from fo_start
  fo_start: "2018-06-01"
  monte_carlo: 500              # draws of the monthly GRACE uncertainty for the trend spread

reference:
  # Random cropland points whose fields are hand-drawn as segmentation reference (stage 3).
  n_points: 70          # 50 target + spares for points that are not on a field
  target_fields: 50
  seed: 42
  points_file: reference/reference_points.geojson   # relative to pipeline/, committed
  fields_file: reference/reference_fields.geojson   # written by the web /reference tool
  overlay_max_px: 2700  # ~10 m/pixel over the pilot area

# Point inside the pilot area used for small access probes in step 00.
probe_point: [33.45, 37.80]

# Data sources (PLAN.md section 3). probe = date window that must contain data
# for the source to count as usable for the planned seasons.
sources:
  earth_engine:
    - key: s2_sr
      name: Sentinel-2 L2A
      id: COPERNICUS/S2_SR_HARMONIZED
      kind: image_collection
      probe: ["2025-07-01", "2025-07-31"]
      required: true
    - key: s2_cloud_score_plus
      name: Sentinel-2 Cloud Score+
      id: GOOGLE/CLOUD_SCORE_PLUS/V1/S2_HARMONIZED
      kind: image_collection
      probe: ["2025-07-01", "2025-07-31"]
      required: true
    - key: landsat8
      name: Landsat 8 C2 L2
      id: LANDSAT/LC08/C02/T1_L2
      kind: image_collection
      probe: ["2025-06-01", "2025-08-31"]
      required: true
    - key: landsat9
      name: Landsat 9 C2 L2
      id: LANDSAT/LC09/C02/T1_L2
      kind: image_collection
      probe: ["2025-06-01", "2025-08-31"]
      required: true
    - key: s1_grd
      name: Sentinel-1 GRD
      id: COPERNICUS/S1_GRD
      kind: image_collection
      probe: ["2025-07-01", "2025-07-31"]
      required: false
    - key: worldcover
      name: ESA WorldCover v200
      id: ESA/WorldCover/v200
      kind: image_collection
      probe: ["2021-01-01", "2021-12-31"]
      required: true
    - key: worldcereal
      name: ESA WorldCereal 2021
      id: ESA/WorldCereal/2021/MODELS/v100
      kind: image_collection
      probe: ["2020-09-01", "2021-12-31"]
      required: false
    - key: hydrosheds_l6
      name: HydroSHEDS basins level 6
      id: WWF/HydroSHEDS/v1/Basins/hybas_6
      kind: feature_collection
      required: true
    - key: era5_land_daily
      name: ERA5-Land daily
      id: ECMWF/ERA5_LAND/DAILY_AGGR
      kind: image_collection
      probe: ["2025-07-01", "2025-07-31"]
      required: true
    - key: modis_et
      name: MODIS MOD16A2GF ET
      id: MODIS/061/MOD16A2GF
      kind: image_collection
      probe: ["2024-06-01", "2024-08-31"]
      required: true
    - key: grace_mascon
      name: GRACE/GRACE-FO mascon
      id: NASA/GRACE/MASS_GRIDS_V04/MASCON
      kind: image_collection
      probe: ["2024-01-01", "2024-12-31"]
      required: true
    - key: gldas_noah
      name: GLDAS 2.1 Noah 3-hourly
      id: NASA/GLDAS/V021/NOAH/G025/T3H
      kind: image_collection
      probe: ["2025-01-01", "2025-01-02"]
      required: true

  http:
    - key: open_meteo
      name: Open-Meteo Historical (FAO-56 ET0, precipitation)
      kind: open_meteo
      url: https://archive-api.open-meteo.com/v1/archive
      probe: ["2025-07-01", "2025-07-07"]
      required: true
    - key: esri_world_imagery
      name: Esri World Imagery tiles
      kind: xyz_tile
      url: https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}
      zoom: 15
      required: true

  manual:
    - key: egms
      name: European Ground Motion Service
      url: https://egms.land.copernicus.eu/
      note: Checked in EGMS Explorer on 2026-10-22, no Türkiye coverage (PLAN.md D9).
      required: false
