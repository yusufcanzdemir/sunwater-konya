[project]
name = "konya-water-budget-pipeline"
version = "0.1.0"
description = "Earth Engine + local processing pipeline for the Konya field-level water budget"
requires-python = ">=3.11"
dependencies = [
    "earthengine-api>=1.5",
    "geemap>=0.35",
    "pyyaml>=6.0",
    "requests>=2.32",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
